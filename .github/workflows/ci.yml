name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Seed migration is in sync with content/seed
        run: npm run seed:build && git diff --exit-code -- migrations/0002_seed.sql
      - run: npm run typecheck
      - run: npx tsc --noEmit -p test/tsconfig.json
      - run: npm test
      - name: No secrets in the bundle
        run: |
          npx wrangler deploy --dry-run --outdir dist
          ! grep -rEil 'GOCSPX-|lin_api_|[0-9]{9,}:[A-Za-z0-9_-]{30,}' dist
